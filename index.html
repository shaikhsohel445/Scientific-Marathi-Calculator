<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वैज्ञानिक मराठी गणकयंत्र</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        .calculator {
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: #f1f1f1;
        }
        .display {
            width: 100%;
            height: 50px;
            text-align: right;
            font-size: 2em;
            margin-bottom: 10px;
        }
        .btn {
            width: 70px;
            height: 50px;
            font-size: 1.2em;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>वैज्ञानिक मराठी गणकयंत्र</h1>
    <div class="calculator">
        <input type="text" id="display" class="display" readonly>
        <br>
        <button class="btn" onclick="clearDisplay()">अ.सा</button>
        <button class="btn" onclick="appendValue('π')">π</button>
        <button class="btn" onclick="appendValue('e')">e</button>
        <button class="btn" onclick="appendValue('^')">^</button>
        <button class="btn" onclick="appendValue('sqrt(')">√</button>
        <br>
        <button class="btn" onclick="appendValue('७')">७</button>
        <button class="btn" onclick="appendValue('८')">८</button>
        <button class="btn" onclick="appendValue('९')">९</button>
        <button class="btn" onclick="appendValue('+')">+</button>
        <br>
        <button class="btn" onclick="appendValue('४')">४</button>
        <button class="btn" onclick="appendValue('५')">५</button>
        <button class="btn" onclick="appendValue('६')">६</button>
        <button class="btn" onclick="appendValue('-')">-</button>
        <br>
        <button class="btn" onclick="appendValue('१')">१</button>
        <button class="btn" onclick="appendValue('२')">२</button>
        <button class="btn" onclick="appendValue('३')">३</button>
        <button class="btn" onclick="appendValue('*')">×</button>
        <br>
        <button class="btn" onclick="appendValue('०')">०</button>
        <button class="btn" onclick="appendValue('.')">.</button>
        <button class="btn" onclick="calculateResult()">=</button>
        <button class="btn" onclick="appendValue('/')">÷</button>
        <br>
        <button class="btn" onclick="appendValue('sin(')">sin</button>
        <button class="btn" onclick="appendValue('cos(')">cos</button>
        <button class="btn" onclick="appendValue('tan(')">tan</button>
        <button class="btn" onclick="appendValue('log(')">log</button>
    </div>
    <script>
        function appendValue(value) {
            document.getElementById('display').value += value;
        }
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
        function calculateResult() {
            try {
                let expression = document.getElementById('display').value.replace(/√/g, 'Math.sqrt').replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E').replace(/log/g, 'Math.log').replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos').replace(/tan/g, 'Math.tan').replace(/\^/g, '**');
                document.getElementById('display').value = eval(expression);
            } catch (error) {
                alert('अवैध गणना!');
            }
        }
    </script>
</body>
</html>
